name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Audit dependencies
        # Advisory only: dotnet list exits 0 even with vulnerabilities.
        # Hard gating is done by NuGetAudit for all projects via Directory.Build.props
        # (NU1901-NU1905 as errors, transitive included).
        run: dotnet list package --vulnerable --include-transitive

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/FluentMigrator.IdempotentExtensions.Tests --no-build --configuration Release --verbosity normal

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore tests/FluentMigrator.IdempotentExtensions.Tests.Integration

      - name: Test against real SQL Server / PostgreSQL / MySQL / Oracle (Testcontainers)
        run: dotnet test tests/FluentMigrator.IdempotentExtensions.Tests.Integration --configuration Release --verbosity normal
