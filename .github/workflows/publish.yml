name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  # NOTE: no id-token:write — OIDC trusted publishing is not configured (see TODO below).
  # Re-add it if NuGet/login via OIDC is ever re-enabled.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack core
        run: dotnet pack src/FluentMigrator.IdempotentExtensions/FluentMigrator.IdempotentExtensions.csproj --no-build --configuration Release --output nupkg

      - name: Pack SqlServer
        run: dotnet pack src/FluentMigrator.IdempotentExtensions.SqlServer/FluentMigrator.IdempotentExtensions.SqlServer.csproj --no-build --configuration Release --output nupkg

      # TODO: switch to OIDC Trusted Publishing (NuGet/login@v1) once a trust
      # policy for this repo/workflow/environment is configured on nuget.org.
      # Token exchange currently fails with HTTP 401 "No matching trust policy".
      # - name: NuGet login via OIDC
      #   uses: NuGet/login@v1
      #   id: nuget-login
      #   with:
      #     user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # --skip-duplicate above swallows "already exists" silently, which once masked
      # a release that pushed nothing (v1.7.1). Fail loudly if a package is missing.
      - name: Verify packages on NuGet.org
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for PKG in tropinalexey.fluentmigrator.idempotentextensions tropinalexey.fluentmigrator.idempotentextensions.sqlserver; do
            for i in $(seq 1 30); do
              if curl -s "https://api.nuget.org/v3-flatcontainer/$PKG/index.json" | grep -q "\"$VERSION\""; then
                echo "$PKG $VERSION found on NuGet.org"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::$PKG $VERSION NOT found on NuGet.org after push"
                exit 1
              fi
              sleep 20
            done
          done
